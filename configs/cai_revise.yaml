# Day 2: generate critique -> revision data.
stage: cai_revise
seed: 0
constitution: constitution.yaml
tags: [harmless]
revision_rounds: 1
model:
  init: runs/sft/final           # the policy whose answers get critiqued
critic:
  kind: hf                       # self | hf | anthropic
  model: Qwen/Qwen2.5-7B-Instruct
  dtype: bf16
  max_new_tokens: 384
  temperature: 0.7
  batch_size: 16
  # kind: anthropic
  # model: claude-haiku-5-5      # needs ANTHROPIC_API_KEY
data:
  prompts: data/redteam_train.jsonl
  limit: 3000
  helpful_mix: data/sft_train.jsonl
  helpful_ratio: 0.5             # half the SL-CAI set is ordinary helpful data
gen:
  max_new_tokens: 256
  temperature: 0.7
  batch_size: 32
out:
  dir: data
